# Render.com — one web service serves the site + API.
# Dashboard settings: Build Command = npm install, Start Command = npm start
services:
  - type: web
    name: designrun
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
